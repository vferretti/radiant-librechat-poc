version: 1.3.13
cache: true

mcpSettings:
  allowedDomains:
    - mcp.dev.qlin.aws.sante.quebec
    # Serveur d'autorisation OAuth du MCP (Keycloak) — résout en IP privée via VPN,
    # doit être explicitement autorisé pour le flux OAuth par utilisateur.
    - auth.dev.qlin.aws.sante.quebec
    # Conteneur BioMCP (littérature biomédicale) — partage le namespace réseau
    # du conteneur api, joignable en localhost:8000.
    - localhost

endpoints:
  all:
    # Titrage des conversations : format déterministe pour les analyses de case,
    # afin de retrouver facilement une conversation dans l'historique.
    # Le placeholder {convo} est obligatoire : LibreChat y injecte la conversation.
    titlePrompt: |
      Generate a concise title for the conversation below.
      MANDATORY RULE: if the conversation concerns a specific case identified by a number
      (e.g. "case 8", "Case 1003", "cas 1131"), the title MUST be exactly "Case <number> Analysis"
      (e.g. "Case 8 Analysis") — nothing else, regardless of the conversation language.
      Otherwise: 5 words maximum, in the language of the conversation, no quotes, no punctuation.

      Conversation:
      {convo}

interface:
  # Autorise l'auto-envoi du prompt passé en URL depuis le portail Radiant
  autoSubmitFromUrl: true
  mcpServers:
    placeholder: 'Serveurs MCP'

mcpServers:
  radiant:
    type: streamable-http
    url: https://mcp.dev.qlin.aws.sante.quebec/mcp/
    timeout: 120000
    # Client OAuth pré-configuré : le Keycloak qlin refuse l'enregistrement dynamique
    # de client (politique « Trusted Hosts »), on réutilise donc le client `radiant`.
    # Chaque utilisateur fait quand même SON flux d'autorisation → droits Ranger individuels.
    oauth:
      authorization_url: https://auth.dev.qlin.aws.sante.quebec/realms/qlin/protocol/openid-connect/auth
      token_url: https://auth.dev.qlin.aws.sante.quebec/realms/qlin/protocol/openid-connect/token
      client_id: radiant
      client_secret: '${OPENID_CLIENT_SECRET}'
      # offline_access : le refresh token survit à l'expiration de la session SSO
      # (sinon reconnexion MCP exigée chaque jour — invalid_grant "Token is not active")
      scope: 'openid email profile offline_access'
    serverInstructions: true

  # Littérature biomédicale : PubMed/PubTator3 (variants normalisés — héritier
  # de LitVar), MyVariant.info, ClinicalTrials.gov. APIs publiques, pas d'OAuth.
  biomcp:
    type: streamable-http
    url: http://localhost:8000/mcp
    timeout: 120000
    serverInstructions: true

  # Outils de visualisation maison (venn_trio) — conteneur radiant-tools, port 8001.
  viz:
    type: streamable-http
    url: http://localhost:8001/mcp
    timeout: 60000
    serverInstructions: true
