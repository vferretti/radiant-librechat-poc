version: 1.3.13
cache: true

mcpSettings:
  allowedDomains:
    - mcp.dev.qlin.aws.sante.quebec
    # Serveur d'autorisation OAuth du MCP (Keycloak) — résout en IP privée via VPN,
    # doit être explicitement autorisé pour le flux OAuth par utilisateur.
    - auth.dev.qlin.aws.sante.quebec

interface:
  # Autorise l'auto-envoi du prompt passé en URL depuis le portail Radiant
  autoSubmitFromUrl: true
  mcpServers:
    placeholder: 'Serveurs MCP'

mcpServers:
  radiant:
    type: streamable-http
    url: https://mcp.dev.qlin.aws.sante.quebec/mcp/
    timeout: 120000
    # Client OAuth pré-configuré : le Keycloak qlin refuse l'enregistrement dynamique
    # de client (politique « Trusted Hosts »), on réutilise donc le client `radiant`.
    # Chaque utilisateur fait quand même SON flux d'autorisation → droits Ranger individuels.
    oauth:
      authorization_url: https://auth.dev.qlin.aws.sante.quebec/realms/qlin/protocol/openid-connect/auth
      token_url: https://auth.dev.qlin.aws.sante.quebec/realms/qlin/protocol/openid-connect/token
      client_id: radiant
      client_secret: '${OPENID_CLIENT_SECRET}'
      # offline_access : le refresh token survit à l'expiration de la session SSO
      # (sinon reconnexion MCP exigée chaque jour — invalid_grant "Token is not active")
      scope: 'openid email profile offline_access'
    serverInstructions: true
